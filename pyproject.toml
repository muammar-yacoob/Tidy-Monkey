[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name (Blender uses bl_* naming)
    "R0903",  # too-few-public-methods (Blender operators are simple)
    "W0613",  # unused-argument (Blender callbacks have fixed signatures)
]

[tool.pylint.format]
max-line-length = 120

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

[tool.black]
line-length = 120
target-version = ['py311']
