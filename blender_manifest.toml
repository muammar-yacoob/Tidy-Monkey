schema_version = "1.0.0"

id = "tidy_monkey"
version = "2.0.0"
name = "Tidy Monkey"
tagline = "Scene Organization Tool for Artists and Game Developers"
maintainer = "Spark Games <support@spark-games.co.uk>"
type = "add-on"

website = "https://spark-games.co.uk"
tags = ["Scene Organization", "Modeling", "Export"]

blender_version_min = "4.0.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2025 Spark Games",
]

# Exclude unnecessary files from the build
exclude = [
  "res/**/*",
  "Social/**/*",
  "Test/**/*",
  ".vscode/**/*",
  ".github/**/*",
  "TidyMonkeyInstaller/**/*",
  "*.bat",
  "*.zip",
  "CHANGELOG.md",
  "PRIVACY.md",
  ".releaserc",
  ".gitignore",
  "README.md",
  "__pycache__/**/*",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.pyd",
  "**/.DS_Store",
  "**/.git/**/*"
] 